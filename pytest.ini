[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    -v
    -W ignore::RuntimeWarning:unittest.mock
    -W ignore::RuntimeWarning:_pytest
    -W ignore::ResourceWarning
    -W ignore::UserWarning:telegram
    -W ignore::pytest.PytestConfigWarning

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
